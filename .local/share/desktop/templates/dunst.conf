# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# Linked as ~/.config/dunst/dunstrc.d/90-theme.conf (read after ~/.config/dunst/dunstrc).
[global]
	font = $font_ui 10.5
	background = "$bg"
	foreground = "$fg"
	frame_color = "$overlay"
	highlight = "$primary"
	icon_theme = "$icon_theme"

[urgency_low]
	background = "$bg"
	foreground = "$fg_muted"
	frame_color = "$overlay"

[urgency_normal]
	background = "$bg"
	foreground = "$fg"
	frame_color = "$overlay"

[urgency_critical]
	background = "$bg"
	foreground = "$fg"
	frame_color = "$error"
	highlight = "$error"
