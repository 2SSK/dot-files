; Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
; Linked as ~/.config/polybar/theme.ini, which ~/.config/polybar/config.ini includes.
[theme]
bg = $bg
bg_alt = $bg_alt
surface = $surface
overlay = $overlay
fg = $fg
fg_muted = $fg_muted
primary = $primary
on_primary = $on_primary
success = $success
warning = $warning
error = $error
font_ui = $font_ui
font_mono = $font_mono

; The items that mix colours in one label: polybar takes a reference only as a whole value, so
; these are made here, with the theme's colours in place: cpu 12%, mem 46%, ⏻.
[module/cpu]
type = internal/cpu
interval = 3
label = %{F$primary}cpu%{F-} %percentage:2%%
warn-percentage = 90
format-warn = <label-warn>
label-warn = %{F$primary}cpu%{F-} %{F$error}%percentage:2%%%{F-}

[module/memory]
type = internal/memory
interval = 5
label = %{F$primary}mem%{F-} %percentage_used:2%%

[module/power]
type = custom/text
format = %{F$error}⏻%{F-}
click-left = desktop menu power
