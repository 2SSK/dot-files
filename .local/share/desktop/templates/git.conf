# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "$primary","$warning","$secondary","$accent","$success","$error"
[color "branch"]
	current = "$secondary bold"
	local = "$fg"
	remote = "$warning"
	upstream = "$success"
	plain = "$primary"
[color "decorate"]
	HEAD = "$error bold"
	branch = "$primary"
	tag = "$warning"
	remoteBranch = "$secondary"
[color "diff"]
	meta = "$fg_muted bold"
	frag = "$secondary"
	context = "$fg"
	old = "$error"
	new = "$success"
	whitespace = "$warning reverse"
[color "status"]
	branch = "$primary bold"
	added = "$success"
	changed = "$warning"
	untracked = "$error"
[color "blame"]
	highlightRecent = "$fg_muted",1 month ago,"$fg",7 days ago,"$primary"
[delta]
	file-style = "$primary" bold
	file-decoration-style = "$border" ul
	hunk-header-style = "$secondary"
	hunk-header-decoration-style = "$border" box
	minus-style = "$error"
	minus-emph-style = "$bg" "$error"
	plus-style = "$success"
	plus-emph-style = "$bg" "$success"
	line-numbers-minus-style = "$error"
	line-numbers-plus-style = "$success"
	line-numbers-zero-style = "$fg_muted"
	line-numbers-left-style = "$border"
	line-numbers-right-style = "$border"
