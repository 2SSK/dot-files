# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# yazi's "desktop" flavor (theme yazi/theme.toml picks it), from the desktop theme's roles; file
# previews use the same colours through tmtheme.xml (the silicon.tmTheme render). Icons: yazi's own.

[mgr]
cwd = { fg = "${primary}" }
find_keyword = { fg = "${warning}", bold = true, italic = true, underline = true }
find_position = { fg = "${accent}", bold = true, italic = true }
marker_copied = { fg = "${success}", bg = "${success}" }
marker_cut = { fg = "${error}", bg = "${error}" }
marker_marked = { fg = "${secondary}", bg = "${secondary}" }
marker_selected = { fg = "${primary}", bg = "${primary}" }
count_copied = { fg = "${bg}", bg = "${success}" }
count_cut = { fg = "${bg}", bg = "${error}" }
count_selected = { fg = "${on_primary}", bg = "${primary}" }
border_symbol = "│"
border_style = { fg = "${border}" }

[indicator]
parent = { fg = "${fg}", bg = "${selection}" }
current = { fg = "${on_primary}", bg = "${primary}" }
preview = { fg = "${fg}", bg = "${selection}" }

[status]
overall = { fg = "${fg}", bg = "${bg_alt}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "${fg}", bold = true }
progress_normal = { fg = "${primary}", bg = "${surface}" }
progress_error = { fg = "${error}", bg = "${surface}" }
perm_type = { fg = "${primary}" }
perm_read = { fg = "${warning}" }
perm_write = { fg = "${error}" }
perm_exec = { fg = "${success}" }
perm_sep = { fg = "${fg_muted}" }

[mode]
normal_main = { fg = "${on_primary}", bg = "${primary}", bold = true }
normal_alt = { fg = "${primary}", bg = "${surface}" }
select_main = { fg = "${bg}", bg = "${secondary}", bold = true }
select_alt = { fg = "${secondary}", bg = "${surface}" }
unset_main = { fg = "${bg}", bg = "${accent}", bold = true }
unset_alt = { fg = "${accent}", bg = "${surface}" }

[tabs]
active = { fg = "${on_primary}", bg = "${primary}", bold = true }
inactive = { fg = "${fg_muted}", bg = "${surface}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border = { fg = "${primary}" }
title = { fg = "${fg}" }
value = { fg = "${fg}" }
selected = { bg = "${selection}" }

[cmp]
border = { fg = "${primary}" }
active = { fg = "${on_primary}", bg = "${primary}" }
inactive = { fg = "${fg}" }

[tasks]
border = { fg = "${primary}" }
title = { fg = "${fg}" }
hovered = { fg = "${primary}", underline = true }

[which]
cols = 3
mask = { bg = "${bg_alt}" }
cand = { fg = "${primary}" }
rest = { fg = "${fg_muted}" }
desc = { fg = "${fg}" }
separator = " ▶ "
separator_style = { fg = "${fg_muted}" }

[spot]
border = { fg = "${primary}" }
title = { fg = "${primary}" }
tbl_col = { fg = "${fg}" }
tbl_cell = { fg = "${on_primary}", bg = "${primary}" }

[help]
on = { fg = "${primary}" }
run = { fg = "${fg}" }
hovered = { bg = "${selection}", bold = true }
footer = { fg = "${on_primary}", bg = "${primary}" }

[notify]
title_info = { fg = "${success}" }
title_warn = { fg = "${warning}" }
title_error = { fg = "${error}" }

[pick]
border = { fg = "${primary}" }
active = { fg = "${on_primary}", bg = "${primary}" }
inactive = { fg = "${fg}" }

[confirm]
border = { fg = "${primary}" }
title = { fg = "${fg}" }
content = { fg = "${fg}" }
list = { fg = "${fg}" }
btn_yes = { fg = "${on_primary}", bg = "${primary}" }
btn_no = { fg = "${fg}", bg = "${surface}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "${accent}" },
	{ mime = "{audio,video}/*", fg = "${warning}" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "${secondary}" },
	{ mime = "application/{pdf,doc,rtf}", fg = "${success}" },
	{ mime = "*", is = "orphan", fg = "${error}" },
	{ mime = "application/*exec*", fg = "${error}" },
	{ url = "*", fg = "${fg}" },
	{ url = "*/", fg = "${primary}" },
]
