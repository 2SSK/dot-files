# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# picom for i3 (X11), started by ~/.config/i3/conf.d/autostart.conf. Light on purpose: vsync (no
# tearing), rounded corners, translucency (kitty's background_opacity) and a short fade-and-grow as
# windows open and close; no blur or shadows, which cost the most GPU and battery. Fullscreen
# windows (videos, games) bypass it. Reference: man picom (animations).

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

corner-radius = 10;
shadow = false;
fading = false;
blur-background = false;

# Matched in order; the last match wins
rules = (
	# square: the bar, the desktop, fullscreen windows, i3's tab and stack headers, the region picker
	{ match = "window_type = 'dock' || window_type = 'desktop' || fullscreen || class_g = 'i3-frame' || class_g = 'slop'";
	  corner-radius = 0; },
	# Tabs and stacks i3 keeps behind the visible one: invisible, so translucent windows don't show them
	{ match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'"; opacity = 0; },
	# no motion for the bar, the region picker and notifications (dunst fades on its own terms)
	{ match = "window_type = 'dock' || class_g = 'slop' || class_g = 'Dunst'";
	  animations = ({ triggers = [ "open", "show", "close", "hide" ]; preset = "appear"; duration = 0.01; }); },
);

# Open: fade in while growing from 88 %, easing out (quick start, soft landing). Close: the reverse,
# quicker. Moves and resizes don't animate: tiling stays instant.
animations = (
	{
		triggers = [ "open", "show" ];
		opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.22; start = 0; end = "window-raw-opacity"; };
		scale-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = 0.88; end = 1; };
		scale-y = "scale-x";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
	},
	{
		triggers = [ "close", "hide" ];
		opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = "window-raw-opacity-before"; end = 0; };
		scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.12; start = 1; end = 0.97; };
		scale-y = "scale-x";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
	},
);
