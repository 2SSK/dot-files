# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# ~/.config/herdr/config.toml links here; theme runs `herdr server reload-config` on a switch.
# Keys follow ~/.config/tmux/tmux.conf: tmux session -> herdr workspace, window -> tab, pane -> pane.
onboarding = false

[theme]
name = "catppuccin" # only a base: every colour is set below from the desktop theme
auto_switch = false

[theme.custom]
accent = "$primary"
panel_bg = "$bg_alt" # the active tab's text, on the accent
sidebar_bg = "$bg_alt"
surface_dim = "$bg"
surface0 = "$surface"
surface1 = "$overlay"
active_row_bg = "$surface"
selection_bg = "$selection"
overlay0 = "$c8"
overlay1 = "$fg_muted"
text = "$fg"
subtext0 = "$fg_muted"
red = "$error"
green = "$success"
yellow = "$warning"
blue = "$c4"
teal = "$c6"
mauve = "$secondary"
peach = "$accent"

[terminal]
new_cwd = "follow" # like -c "#{pane_current_path}"

[ui]
mouse_capture = true # set -g mouse on
tab_bar_position = "top" # status-position top

[keys]
prefix = "backtick" # set -g prefix `

help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+r" # bind r source-file
copy_mode = "prefix+[" # vi keys in copy mode, as mode-keys vi
settings = "prefix+shift+s"

# panes: w side by side, s stacked, h/j/k/l to move, Ctrl+h/j/k/l to resize, m to zoom. Ctrl+h/j/k/l
# without the prefix stay with the app: herdr can't hand them to nvim's splits as tmux's navigator does
split_vertical = "prefix+w"
split_horizontal = "prefix+s"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"
resize_mode = "prefix+shift+r"
zoom = ["prefix+m", "prefix+z"]
close_pane = "prefix+x"

# windows -> tabs: c new, n/p, 1-9, Ctrl+Left/Right to move, , rename, & close
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
move_tab_previous = "prefix+ctrl+left"
move_tab_next = "prefix+ctrl+right"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"

# sessions -> workspaces: Space picks one, as the sessions popup
workspace_picker = "prefix+space"
