# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# eza's colours (~/.config/eza/theme.yml links here). The shell runs eza without LS_COLORS, which
# would override this file.
colourful: true

filekinds:
  normal: {foreground: "${fg}"}
  directory: {foreground: "${primary}", is_bold: true}
  symlink: {foreground: "${accent}"}
  pipe: {foreground: "${warning}"}
  block_device: {foreground: "${warning}", is_bold: true}
  char_device: {foreground: "${warning}", is_bold: true}
  socket: {foreground: "${secondary}"}
  special: {foreground: "${secondary}"}
  executable: {foreground: "${success}", is_bold: true}
  mount_point: {foreground: "${primary}", is_underline: true}

perms:
  user_read: {foreground: "${warning}"}
  user_write: {foreground: "${error}"}
  user_execute_file: {foreground: "${success}", is_bold: true}
  user_execute_other: {foreground: "${success}"}
  group_read: {foreground: "${warning}"}
  group_write: {foreground: "${error}"}
  group_execute: {foreground: "${success}"}
  other_read: {foreground: "${warning}"}
  other_write: {foreground: "${error}"}
  other_execute: {foreground: "${success}"}
  special_user_file: {foreground: "${secondary}"}
  special_other: {foreground: "${secondary}"}
  attribute: {foreground: "${fg_muted}"}

size:
  major: {foreground: "${accent}"}
  minor: {foreground: "${accent}"}
  number_byte: {foreground: "${fg}"}
  number_kilo: {foreground: "${fg}"}
  number_mega: {foreground: "${accent}"}
  number_giga: {foreground: "${warning}"}
  number_huge: {foreground: "${error}"}
  unit_byte: {foreground: "${fg_muted}"}
  unit_kilo: {foreground: "${fg_muted}"}
  unit_mega: {foreground: "${accent}"}
  unit_giga: {foreground: "${warning}"}
  unit_huge: {foreground: "${error}"}

users:
  user_you: {foreground: "${primary}"}
  user_root: {foreground: "${error}"}
  user_other: {foreground: "${secondary}"}
  group_yours: {foreground: "${primary}"}
  group_other: {foreground: "${fg_muted}"}
  group_root: {foreground: "${error}"}

links:
  normal: {foreground: "${accent}"}
  multi_link_file: {foreground: "${accent}", is_bold: true}

git:
  new: {foreground: "${success}"}
  modified: {foreground: "${warning}"}
  deleted: {foreground: "${error}"}
  renamed: {foreground: "${accent}"}
  typechange: {foreground: "${secondary}"}
  ignored: {foreground: "${fg_muted}"}
  conflicted: {foreground: "${error}", is_bold: true}

git_repo:
  branch_main: {foreground: "${fg}"}
  branch_other: {foreground: "${secondary}"}
  git_clean: {foreground: "${success}"}
  git_dirty: {foreground: "${warning}"}

file_type:
  image: {foreground: "${accent}"}
  video: {foreground: "${warning}"}
  music: {foreground: "${warning}"}
  lossless: {foreground: "${warning}"}
  crypto: {foreground: "${error}"}
  document: {foreground: "${success}"}
  compressed: {foreground: "${secondary}"}
  temp: {foreground: "${fg_muted}"}
  compiled: {foreground: "${fg_muted}"}
  build: {foreground: "${warning}", is_underline: true}
  source: {foreground: "${fg}"}

punctuation: {foreground: "${fg_muted}"}
date: {foreground: "${secondary}"}
inode: {foreground: "${fg_muted}"}
blocks: {foreground: "${fg_muted}"}
header: {foreground: "${fg}", is_underline: true}
octal: {foreground: "${accent}"}
flags: {foreground: "${fg_muted}"}
control_char: {foreground: "${error}"}
broken_symlink: {foreground: "${error}"}
broken_path_overlay: {is_underline: true}
