<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generated by theme_render.py ($family $mode, fonts $font_collection); edit the template, not the output.
     ~/.config/fontconfig/fonts.conf links here: what browsers and every app asking for sans-serif or
     monospace get. Icons fall back to the Nerd Font, colour emoji to Noto. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>$font_ui</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>$font_mono</family><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
