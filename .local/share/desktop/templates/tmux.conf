# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "$primary"
set -g @minimal-tmux-fg "$on_primary"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=$accent],#[bg=$primary]}#[fg=$on_primary bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=$fg_muted"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$$f" ] && "$$f"; true'
setw -g window-status-activity-style "fg=$warning"
setw -g window-status-bell-style "fg=$warning bold"
set -g message-style "fg=$on_primary bg=$primary"
set -g message-command-style "fg=$on_primary bg=$warning"
set -g mode-style "fg=$fg bg=$selection"
set -g pane-border-style "fg=$border"
set -g pane-active-border-style "fg=$border_active"
set -g popup-border-style "fg=$border_active"
set -g display-panes-colour "$fg_muted"
set -g display-panes-active-colour "$primary"
set -g clock-mode-colour "$primary"
