# Generated by theme_render.py ($family, starts $mode); edit the theme or this template, not the output.
# Both variants are here so SIGUSR1 (dark) / SIGUSR2 (light) switch mode live.
[main]
initial-color-theme=$mode

[colors-dark]
foreground=${dark_fg_x}
background=${dark_bg_x}
cursor=${dark_bg_x} ${dark_fg_x}
selection-foreground=${dark_fg_x}
selection-background=${dark_selection_x}
urls=${dark_primary_x}
regular0=${dark_c0_x}
regular1=${dark_c1_x}
regular2=${dark_c2_x}
regular3=${dark_c3_x}
regular4=${dark_c4_x}
regular5=${dark_c5_x}
regular6=${dark_c6_x}
regular7=${dark_c7_x}
bright0=${dark_c8_x}
bright1=${dark_c9_x}
bright2=${dark_c10_x}
bright3=${dark_c11_x}
bright4=${dark_c12_x}
bright5=${dark_c13_x}
bright6=${dark_c14_x}
bright7=${dark_c15_x}

[colors-light]
foreground=${light_fg_x}
background=${light_bg_x}
cursor=${light_bg_x} ${light_fg_x}
selection-foreground=${light_fg_x}
selection-background=${light_selection_x}
urls=${light_primary_x}
regular0=${light_c0_x}
regular1=${light_c1_x}
regular2=${light_c2_x}
regular3=${light_c3_x}
regular4=${light_c4_x}
regular5=${light_c5_x}
regular6=${light_c6_x}
regular7=${light_c7_x}
bright0=${light_c8_x}
bright1=${light_c9_x}
bright2=${light_c10_x}
bright3=${light_c11_x}
bright4=${light_c12_x}
bright5=${light_c13_x}
bright6=${light_c14_x}
bright7=${light_c15_x}
