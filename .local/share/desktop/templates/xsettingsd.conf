# Generated by theme_render.py ($family $mode); edit the theme or this template, not the output.
# Read by xsettingsd on X11 (started by i3); GTK apps pick changes up live. theme reloads it (SIGHUP).
Net/ThemeName "$gtk_theme"
Net/IconThemeName "$icon_theme"
Gtk/CursorThemeName "Bibata-Modern-Ice"
Gtk/CursorThemeSize 24
Gtk/FontName "Inter 11"
Gtk/MonospaceFontName "JetBrainsMono Nerd Font 11"
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
# Text at about 101 dpi (in 1024ths): 1.05x, a touch larger than X's 96 for GTK apps, browsers and
# the shell; 1.25x (GNOME's text-scaling-factor, as on sway) made the bar too big
Xft/DPI 103219
