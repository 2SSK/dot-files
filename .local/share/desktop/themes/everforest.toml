# Everforest: medium dark / medium light. Palette values copied from sainnhe/everforest
# (autoload/everforest.vim); terminal colours follow its colors/everforest.vim mapping, except bright
# black (c8), which uses grey1 so dimmed terminal text stays readable.
# Source: https://github.com/sainnhe/everforest  License: MIT  Copyright: sainnhe

[meta]
family = "everforest"
name = "Everforest"
source = "https://github.com/sainnhe/everforest"
license = "MIT"

[dark.ui]
bg = "#2d353b"
bg_alt = "#232a2e"
surface = "#343f44"
overlay = "#3d484d"
fg = "#d3c6aa"
fg_muted = "#859289"
primary = "#a7c080"
on_primary = "#2d353b"
secondary = "#7fbbb3"
accent = "#e69875"
success = "#a7c080"
warning = "#dbbc7f"
error = "#e67e80"
border = "#475258"
border_active = "#a7c080"
selection = "#543a48"

[dark.ansi]
