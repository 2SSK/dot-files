c3 = "#d0d0d0"
c4 = "#a0a0a0"
c5 = "#c4c4c4"
c6 = "#9a9a9a"
c7 = "#d8d8d8"
c8 = "#7a7a7a"
c9 = "#f08a8c"
c10 = "#c8c8c8"
c11 = "#e0e0e0"
c12 = "#b8b8b8"
c13 = "#d4d4d4"
c14 = "#acacac"
c15 = "#f4f4f4"

[light.ui]
