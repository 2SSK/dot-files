# E-ink: greyscale dark / light for monochrome wallpapers. Based on e-ink.nvim's mono ramp, with the
# contrast raised: near-white ink on charcoal, near-black ink on warm paper, and wider grey steps so
# terminal colours stay distinct. Error red from everforest, as e-ink.nvim uses.
# Source: https://github.com/alexxGmZ/e-ink.nvim  License: MIT  Copyright: Algilbert Gomez

[meta]
family = "eink"
name = "E-ink"
source = "https://github.com/alexxGmZ/e-ink.nvim"
license = "MIT"

[dark.ui]
bg = "#1c1c1c"
bg_alt = "#141414"
surface = "#2a2a2a"
overlay = "#3a3a3a"
fg = "#e4e4e4"
fg_muted = "#a8a8a8"
primary = "#f0f0f0"
on_primary = "#1c1c1c"
secondary = "#c8c8c8"
accent = "#bdbdbd"
success = "#c8c8c8"
warning = "#f0f0f0"
error = "#e67e80"
border = "#3a3a3a"
border_active = "#9a9a9a"
selection = "#3d3d3d"

[dark.ansi]
c0 = "#2a2a2a"
c1 = "#e67e80"
