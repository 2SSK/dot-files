# Omni: dark only (upstream has no light variant). Palette values copied from the Omni README;
# terminal colours from its official kitty theme (getomni/kitty, omni.conf). Its comment colour
# is too dark to read as text, so muted text uses its purple.
# Source: https://github.com/getomni/omni  License: MIT  Copyright: Omni Theme, João Nery (kitty)

[meta]
family = "omni"
name = "Omni"
source = "https://github.com/getomni/omni"
license = "MIT"

[dark.ui]
bg = "#191622"
bg_alt = "#191622"
surface = "#41414d"
overlay = "#44475a"
fg = "#e1e1e6"
fg_muted = "#988bc7"
primary = "#ff79c6"
on_primary = "#191622"
secondary = "#988bc7"
accent = "#e89e64"
success = "#67e480"
warning = "#e7de79"
error = "#e96379"
border = "#41414d"
border_active = "#ff79c6"
selection = "#41414d"

[dark.ansi]
c0 = "#4d4d4d"
c1 = "#ff6e67"
c2 = "#5af78e"
c3 = "#eaf08d"
c4 = "#caa9fa"
c5 = "#ff92d0"
c6 = "#aa91e3"
c7 = "#e6e6e6"
c8 = "#000000"
c9 = "#ff5555"
c10 = "#50fa7b"
c11 = "#effa78"
c12 = "#bd93f9"
c13 = "#ff79c6"
c14 = "#8d79ba"
c15 = "#bfbfbf"
