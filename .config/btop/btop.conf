# Only the settings that differ from btop's defaults. The `btop` alias passes
# --themes-dir ~/.local/state/desktop/theme, where theme_render.py writes btop.theme.
color_theme = "btop"
theme_background = true
truecolor = true
rounded_corners = true
vim_keys = true
save_config_on_exit = false # btop would otherwise rewrite this tracked file
