# tmux: prefix ` (backtick), vi keys, a minimal status bar coloured by the desktop theme.
# Plugins are pinned in packages/plugins.txt and installed into ~/.config/tmux/plugins by setup.sh.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,foot:RGB,st-256color:RGB,xterm-256color:RGB"
set -g allow-passthrough on
set -ga update-environment "TERM TERM_PROGRAM"
set -g escape-time 10 # no lag on Esc for vim mode in zsh and nvim
set -g focus-events on
set -g mouse on
set -g history-limit 150000
set -g set-titles on
set -g set-titles-string "#W"
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g prefix `
unbind C-b
bind ` send-prefix

# Status bar at the top: session on the left (● while the prefix is held), windows centred, host
# on the right. Colours and formats come from the desktop theme (continuum hooks into status-right).
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 40
set -g window-status-separator "   "
source-file -q ~/.local/state/desktop/theme/tmux.conf

# Copy mode: v selects, y copies
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind y setw synchronize-panes \; display "Sync panes: #{?pane_synchronized,on,off}"
bind v run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" \; display "Session saved"

# Splits keep the current directory: w side by side, s stacked
bind w split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2
bind m resize-pane -Z
bind -r C-Left swap-window -t -1 \; select-window -t -1
bind -r C-Right swap-window -t +1 \; select-window -t +1

# Plugins: options first, then load in order (continuum's auto-restore needs resurrect)
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
set -g @sessionx-bind "space"

run-shell 'p=~/.config/tmux/plugins; for f in tmux-resurrect/resurrect.tmux tmux-continuum/continuum.tmux \
	vim-tmux-navigator/vim-tmux-navigator.tmux tmux-sessionx/sessionx.tmux; do
	[ -x "$p/$f" ] && "$p/$f"; done; true'
