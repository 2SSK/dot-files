# Kept from the noctalia sway setup: app keys and voxtype (voice typing; $mod+v starts it here,
# where i3 splits vertically), with voxtype's own key modes
bindsym $mod+b exec brave
bindsym $alt+b exec firefox
bindsym $alt+f exec $files
bindsym $mod+t exec alacritty
bindsym --no-warn $mod+v exec voxtype
include ~/.config/sway/conf.d/voxtype-mode.conf
exec_always --no-startup-id voxtype
