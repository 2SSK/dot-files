# What the session starts (i3's autostart.conf, for sway). The shell is the bar, notifications,
# polkit agent, lock screen (Quickshell's session lock) and idle (swayidle, from its settings).

# xdg-desktop-portal (screen recording of a window) needs the sway session target
exec_always systemctl --user start sway-session.target
# the shell, a service that starts it again if it stops, given sway's whole environment first (the
# login's PATH: the shell runs the desktop-* commands, and what the launcher opens inherits it)
exec_always --no-startup-id dbus-update-activation-environment --systemd --all && systemctl --user start desktop-shell.service
# SwayFX's corners, shadows and blur (effects.conf) in the config, on SwayFX only
exec_always --no-startup-id desktop effects
# the wallpaper: awww's daemon, on the remembered one (desktop wallpaper; i3's is feh)
exec --no-startup-id desktop wallpaper restore
exec --no-startup-id autotiling
exec --no-startup-id dex --autostart --environment sway
# tmux in the background, its saved sessions restored (as i3's autostart.conf)
exec --no-startup-id tmux-save start
