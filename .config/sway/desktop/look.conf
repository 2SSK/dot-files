# swayfx's touches for the shell: its bar and panels are layer surfaces (the bar, popups) or
# windows titled "Desktop …" (panels drawn in a window as big as the screen: no corners, no shadow)
# blur only where the bar draws: its layer surface spans the screen's width
layer_effects "quickshell" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
for_window [title="^Desktop (control center|clipboard|wallpaper|launcher|capture|authentication)$"] corner_radius 0, shadows disable
