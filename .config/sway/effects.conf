# SwayFX's look, the same as i3 + picom: rounded corners, soft shadows, blur behind translucent
# windows. Sent as commands by desktop-effects (sway's startup, and each reload), and only when the
# compositor is SwayFX: plain sway (Debian, Ubuntu) has none of these and would refuse the config.
corner_radius 12
shadows enable
shadow_blur_radius 24
shadow_offset 0 6
shadow_color #00000052
shadow_inactive_color #00000033
blur enable
blur_passes 2
blur_radius 5
animation_duration_ms 180
default_dim_inactive 0

# The shell: its bar and popups are layer surfaces (blur where the bar draws: its surface spans the
# screen's width), its panels windows titled "Desktop …" as big as the screen (no corners, no shadow)
layer_effects "quickshell" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
for_window [title="^Desktop (control center|clipboard|wallpaper|launcher|capture|authentication)$"] corner_radius 0, shadows disable
