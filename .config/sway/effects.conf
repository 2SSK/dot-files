# SwayFX's look, the same as i3 + picom: rounded corners, soft shadows, blur behind translucent
# windows. Sent as commands by desktop-effects (sway's startup, and each reload), and only when the
# compositor is SwayFX: plain sway (Debian, Ubuntu) has none of these and would refuse the config.
# rounded, with gaps around every window (smart_corner_radius off: a lone window keeps its corners)
corner_radius 14
smart_corner_radius off

# a soft, deep shadow, lighter under unfocused windows; on apps that draw their own title bar too
shadows enable
shadows_on_csd enable
shadow_blur_radius 30
shadow_offset 0 10
shadow_color #00000080
shadow_inactive_color #00000040

# blur behind translucent windows (kitty is at 90%): three passes, a touch of noise against
# banding, a little more colour, a little less glare
blur enable
blur_xray disable
blur_passes 3
blur_radius 5
blur_noise 0.015
blur_brightness 0.95
blur_contrast 1.0
blur_saturation 1.15

# unfocused windows a shade darker; no line under title bars
default_dim_inactive 0.05
dim_inactive_colors.unfocused #000000FF
titlebar_separator disable
animation_duration_ms 180

# The shell: its bar and popups are layer surfaces (blur where the bar draws: its surface spans the
# screen's width), its panels windows titled "Desktop …" as big as the screen (no corners, no shadow)
layer_effects "quickshell" "blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0"
for_window [title="^Desktop (control center|clipboard|wallpaper|launcher|capture|authentication)$"] corner_radius 0, shadows disable
