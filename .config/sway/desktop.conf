# Sway with the desktop shell (Quickshell, `qs -c desktop`): the port of the i3 session. The keys,
# workspaces, window rules, colours and resize mode are i3's own files (i3 and sway read the same
# language); sway's variables, outputs and input (SwayFX's corners, shadows and blur: effects.conf), and what only
# sway needs (desktop/), are here.
include ~/.config/sway/variables
set $shell exec --no-startup-id qs -c desktop ipc call

include ~/.config/i3/conf.d/look.conf
include ~/.config/i3/conf.d/keys.conf
include ~/.config/i3/conf.d/workspaces.conf
include ~/.config/i3/conf.d/resize.conf

# the screens (the laptop panel at the left, externals to its right) and the input devices
include ~/.config/sway/outputs
include ~/.config/sway/input

include ~/.config/sway/desktop/*.conf
include /etc/sway/config.d/*
