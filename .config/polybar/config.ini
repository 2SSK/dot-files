; polybar, the i3 session's bar (sway keeps the Quickshell shell). Started by `desktop bar start`
; (i3's autostart), one bar per screen. Minimal, words rather than icons: a label in the accent,
; the value beside it, room between them. Colours and fonts from the desktop theme
; (~/.config/polybar/theme.ini, rendered by `theme`, which restarts the bar on a switch).
;   left    workspaces (the one you're on on a lighter ground, underlined in the accent), the scratchpad while it holds windows (a
;           click shows or hides it)
;   centre  the date and time; "rec" and the time while recording (a click stops it)
;   right   cpu, mem, bat (chr while charging), power (the power menu)
; The custom modules are `desktop bar <module>`.

include-file = ~/.config/polybar/theme.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 34
line-size = 2
background = ${theme.bg}
foreground = ${theme.fg}
padding-left = 0
padding-right = 2
module-margin = 2
; the font collection's monospace, then the Nerd Font for the power glyph
font-0 = ${theme.font_mono}:weight=bold:size=12;3
font-1 = JetBrainsMono Nerd Font:size=13;3
modules-left = workspaces scratch
modules-center = clock recording
modules-right = cpu memory battery power
cursor-click = pointer
enable-ipc = true

[module/workspaces]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-focused = %name%
label-focused-background = ${theme.surface}
label-focused-underline = ${theme.primary}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${theme.fg_muted}
label-unfocused-padding = 1
label-visible = %name%
label-visible-underline = ${theme.overlay}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${theme.error}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${theme.warning}

[module/scratch]
type = custom/script
exec = desktop bar scratch
tail = true
click-left = desktop scratch toggle

[module/clock]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/recording]
type = custom/script
exec = desktop bar recording
tail = true
click-left = desktop record stop

; cpu, memory and power: in theme.ini (their labels carry the theme's colours)

[module/battery]
type = custom/script
exec = desktop bar battery
interval = 30

[settings]
screenchange-reload = true
pseudo-transparency = false
