bindsym $mod+Return exec $term
bindsym $mod+d exec --no-startup-id $menu
bindsym $mod+Tab exec --no-startup-id rofi -show window
bindsym $mod+q kill

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Left move window to output left
bindsym $mod+Shift+Right move window to output right

bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+z split h
bindsym $mod+v split v
bindsym $mod+a focus parent
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle

bindsym $mod+Shift+Return move scratchpad
bindsym $mod+minus scratchpad show

bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# Volume, microphone and brightness: the shell changes them and shows the level in the island.
# F1–F6 do the same (F1–F5 as on sway). Caps Lock and Num Lock show there by themselves.
set $shell exec --no-startup-id qs -c desktop ipc call
bindsym XF86AudioRaiseVolume $shell audio up
bindsym XF86AudioLowerVolume $shell audio down
bindsym XF86AudioMute $shell audio mute
bindsym XF86AudioMicMute $shell audio mic
bindsym XF86MonBrightnessUp $shell brightness up
bindsym XF86MonBrightnessDown $shell brightness down
bindsym F1 $shell audio mute
bindsym F2 $shell audio down
bindsym F3 $shell audio up
bindsym F4 $shell brightness down
bindsym F5 $shell brightness up
bindsym F6 $shell audio mic
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous

# Hide or show the bar; record the screen (again to stop, saved in ~/Videos)
bindsym $mod+Shift+b $shell bar toggle
bindsym $mod+F12 $shell recorder toggle

# Notification centre (the bell): history, Do Not Disturb, clear all
bindsym $mod+n $shell notifications toggle

# The shell's settings
bindsym $mod+Shift+s $shell settings toggle
bindsym $mod+c $shell control toggle
bindsym $mod+Shift+v $shell clipboard toggle
bindsym $mod+Shift+p $shell wallpaper toggle
bindsym $mod+Shift+t $shell control page todo
bindsym $mod+Shift+n $shell control page notes

# The power menu opens in the island. Its popup can't take the keyboard on X11, so while it's open
# i3 is in this mode and hands the keys over. The key enters the mode itself, so keys pressed while
# the shell is still being reached land in the menu; a click on the bar's button switches it too.
bindsym $mod+p $shell power open; mode "power"
mode "power" {
	bindsym Left $shell power prev
	bindsym h $shell power prev
	bindsym Shift+Tab $shell power prev
	bindsym Right $shell power next
	bindsym l $shell power next
	bindsym Tab $shell power next
	bindsym Return $shell power activate
	bindsym space $shell power activate
	bindsym 1 $shell power pick 1
	bindsym 2 $shell power pick 2
	bindsym 3 $shell power pick 3
	bindsym 4 $shell power pick 4
	bindsym 5 $shell power pick 5
	bindsym Escape $shell power close; mode "default"
	bindsym $mod+p $shell power close; mode "default"
}
