# exec_always also runs on every reload (theme reloads i3), so it only starts what isn't running.

# Screens: an external one to the right of the panel, arranged again when one is plugged in or out
exec --no-startup-id desktop-displays watch

# Wallpaper: the one picked last (~/.local/state/desktop/wallpaper links to it), else the default
exec --no-startup-id desktop-wallpaper restore

# picom falls back to xrender (no blur) where OpenGL isn't available; why it did is in picom.log
exec_always --no-startup-id pgrep -x picom >/dev/null || picom --config ~/.local/state/desktop/theme/picom.conf 2>>"$XDG_RUNTIME_DIR/picom.log" || picom --config ~/.local/state/desktop/theme/picom.conf --backend xrender 2>>"$XDG_RUNTIME_DIR/picom.log"

# The touchpad as on sway: tap, natural two-finger scrolling at Wayland's pace, clickfinger
exec_always --no-startup-id desktop-input
exec_always --no-startup-id pgrep -x xsettingsd >/dev/null || xsettingsd -c ~/.local/state/desktop/theme/xsettingsd.conf

# The lock screen: on `loginctl lock-session` (the power menu's Lock), a closed lid, sleep, and idle (the shell sets X's timers from
# Settings → Power: the screen dims first, desktop-idle dim, and any key or movement brings it back)
exec --no-startup-id xss-lock --notifier='desktop-idle dim' --transfer-sleep-lock -- desktop-lock

# The shell (bar): --no-duplicate makes this a no-op while it runs
exec_always --no-startup-id qs -c desktop --no-duplicate --daemonize

exec_always --no-startup-id pgrep -x autotiling >/dev/null || autotiling

exec --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id dex --autostart --environment i3
