# exec_always: these also run on $mod+Shift+r. Running daemons reload their config instead of
# starting twice (picom and xsettingsd re-read it on a signal; theme sends the same signals).

# Wallpaper: the one picked last (~/.local/state/desktop/wallpaper links to it), else the default
exec_always --no-startup-id feh --bg-fill ~/.local/state/desktop/wallpaper 2>/dev/null || feh --bg-fill ~/.local/share/desktop/wallpapers/cat-mocha-lavender_19.jpg

# Compositor (rendered by theme): rounded corners, shadows, blur, animations. Falls back to xrender
# (no blur) where OpenGL isn't available
exec_always --no-startup-id pkill -USR1 -x picom || picom --config ~/.local/state/desktop/theme/picom.conf || picom --config ~/.local/state/desktop/theme/picom.conf --backend xrender

# Icons, cursor and fonts for GTK apps (rendered by theme)
exec_always --no-startup-id pkill -HUP -x xsettingsd || xsettingsd -c ~/.local/state/desktop/theme/xsettingsd.conf

# New windows split along the longer side of the focused one
exec_always --no-startup-id pgrep -x autotiling >/dev/null || autotiling

exec --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id dex --autostart --environment i3
