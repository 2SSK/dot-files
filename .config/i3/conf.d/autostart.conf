# exec_always lines also run on every i3 reload (and theme reloads i3 to recolour it), so they only
# start what isn't running: anything more would redraw the screen on every theme switch.

# Wallpaper: the one picked last (~/.local/state/desktop/wallpaper links to it), else the default
exec --no-startup-id feh --bg-fill ~/.local/state/desktop/wallpaper 2>/dev/null || feh --bg-fill ~/.local/share/desktop/wallpapers/cat-mocha-lavender_19.jpg

# Compositor (rendered by theme): rounded corners, shadows, blur, animations. Falls back to xrender
# (no blur) where OpenGL isn't available
exec_always --no-startup-id pgrep -x picom >/dev/null || picom --config ~/.local/state/desktop/theme/picom.conf || picom --config ~/.local/state/desktop/theme/picom.conf --backend xrender

# Icons, cursor and fonts for GTK apps (rendered by theme)
exec_always --no-startup-id pgrep -x xsettingsd >/dev/null || xsettingsd -c ~/.local/state/desktop/theme/xsettingsd.conf

# New windows split along the longer side of the focused one
exec_always --no-startup-id pgrep -x autotiling >/dev/null || autotiling

exec --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id dex --autostart --environment i3
