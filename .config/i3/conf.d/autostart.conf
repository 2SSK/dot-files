# exec_always also runs on every reload (theme reloads i3), so it only starts what isn't running.

# Wallpaper: the one picked last (~/.local/state/desktop/wallpaper links to it), else the default
exec --no-startup-id desktop-wallpaper restore

# picom falls back to xrender (no blur) where OpenGL isn't available
exec_always --no-startup-id pgrep -x picom >/dev/null || picom --config ~/.local/state/desktop/theme/picom.conf || picom --config ~/.local/state/desktop/theme/picom.conf --backend xrender

# The touchpad as on sway: tap, natural two-finger scrolling at Wayland's pace, clickfinger
exec_always --no-startup-id desktop-input
exec_always --no-startup-id pgrep -x xsettingsd >/dev/null || xsettingsd -c ~/.local/state/desktop/theme/xsettingsd.conf

# The lock screen for `loginctl lock-session` (the power menu's Lock), a closed lid and before sleep
exec --no-startup-id xss-lock --transfer-sleep-lock -- desktop-lock

# The shell (bar): --no-duplicate makes this a no-op while it runs
exec_always --no-startup-id qs -c desktop --no-duplicate --daemonize

exec_always --no-startup-id pgrep -x autotiling >/dev/null || autotiling

exec --no-startup-id xrdb -merge ~/.Xresources
exec --no-startup-id dex --autostart --environment i3
