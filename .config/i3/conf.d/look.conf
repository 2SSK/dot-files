# Theme colours (rendered by theme, reloaded live): calm borders, tab headers on the background
include ~/.local/state/desktop/theme/i3.conf

# Titles in Inter; icons in titles fall back to the Nerd Font
font pango:Inter, JetBrainsMono Nerd Font Medium 11
title_align center

# No title bars on single windows; picom rounds the corners and draws the shadows
default_border pixel 2
default_floating_border pixel 2
gaps inner 12
gaps outer 6

floating_modifier $mod
focus_follows_mouse yes
focus_on_window_activation smart
for_window [window_role="pop-up|dialog|bubble"] floating enable
