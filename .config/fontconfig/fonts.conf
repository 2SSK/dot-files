<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Inter for interface text, JetBrains Mono Nerd Font for code and terminals, colour emoji as fallback. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
