# Colours come from the central desktop theme; desktop-theme re-renders it and
# sends SIGUSR1/SIGUSR2 for dark/light (a new family applies to new windows).
include=~/.local/state/desktop/theme/foot.ini

font=JetBrainsMono Nerd Font:size=14
pad=16x16 center

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[colors-dark]
alpha=0.9

[colors-light]
alpha=0.9
