# lazygit: colours come from the desktop theme (merged in through LG_CONFIG_FILE, see shell/env.sh);
# delta renders diffs with the [delta] settings of ~/.config/git/config.
gui:
  nerdFontsVersion: "3"
  showRandomTip: false
git:
  diffRenderers:
    - command: delta --paging=never --{{colorScheme}}
      colorArg: always
