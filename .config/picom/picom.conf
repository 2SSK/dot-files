# picom (i3 / X11): rounded corners, soft shadows, background blur and short, subtle animations.
# Sway gets the same look from SwayFX. Reference: man picom (window rules, animations).

backend = "glx";
vsync = true;
use-damage = true;

# Look
corner-radius = 12;
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.32;
shadow-offset-x = -20;
shadow-offset-y = -14;
blur-method = "dual_kawase"; # only behind windows that are themselves translucent
blur-strength = 4;
blur-background = true;

# Exceptions, matched in order (the last match wins)
rules = (
	{ match = "window_type = 'dock' || window_type = 'desktop'";
	  corner-radius = 0; shadow = false; blur-background = false; },
	{ match = "fullscreen"; corner-radius = 0; shadow = false; },
	{ match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'";
	  corner-radius = 8; },
	# GTK windows that draw their own decorations and shadow
	{ match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
);

# Animations: windows scale up and fade in (open, or their workspace shown), the reverse when they
# go, and glide when tiling moves or resizes them
animations = (
	{ triggers = [ "open", "show" ]; preset = "appear"; scale = 0.95; duration = 0.18; },
	{ triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.14; },
	{ triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.2; },
);
