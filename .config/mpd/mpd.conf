# mpd: plays ~/Music through PipeWire as a systemd user service (setup.sh enables it).
# State and playlists live under XDG dirs; the service drop-in creates them.
music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/state/mpd/database"
state_file         "~/.local/state/mpd/state"
sticker_file       "~/.local/state/mpd/sticker.sql"

bind_to_address    "127.0.0.1"
port               "6600"
auto_update        "yes"
restore_paused     "yes"

audio_output {
	type "pipewire"
	name "PipeWire"
}
