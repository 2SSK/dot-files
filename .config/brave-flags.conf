# Read by the browser's launcher (one flag per line). Video decoded on the GPU (VA-API, Intel's
# iHD driver): YouTube on the CPU kept the laptop near 97 °C. Wayland natively, not XWayland.
--ozone-platform-hint=auto
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
