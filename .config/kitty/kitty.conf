# Colours come from the central desktop theme; theme re-renders it and sends SIGUSR1 to reload.
include ~/.local/state/desktop/theme/kitty.conf

font_family JetBrainsMono Nerd Font
font_size 14
modify_font cell_height 110%
disable_ligatures cursor

window_padding_width 16
hide_window_decorations yes
background_opacity 0.9
remember_window_size no
confirm_os_window_close 0
enable_audio_bell no

# Block cursor without blinking; a short trail follows big jumps
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 8.0

url_style curly
scrollback_lines 10000

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Machine-only settings (fonts, keys like F8), untracked
globinclude local.conf
