include ~/.local/state/desktop/theme/kitty.conf
# Colours: the desktop theme. theme recolours open windows over this socket (colours only, no
# reload). socket-only and in the private runtime dir: programs inside the terminal can't use it.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

font_size 14
modify_font cell_height 110%
disable_ligatures cursor

window_padding_width 16
hide_window_decorations yes
background_opacity 0.9
remember_window_size no
confirm_os_window_close 0
enable_audio_bell no

# Block cursor without blinking. It smears as it jumps (vim motions: w, }, gg, Ctrl+d), kitty's own
# trail in the cursor's colour: for jumps of 2 cells or more (typing doesn't smear), fading in 0.1-0.4 s
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_bar_margin_width 8.0
# every tab the same width: the title centred in 20 cells, a longer one cut (it grew with the title)
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title:^20.20}"
active_tab_title_template "{title:^20.20}"

url_style curly
scrollback_lines 10000
# Gentler scrolling: 3 lines a wheel step (5 by default), the touchpad at 0.6x
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 0.6

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Machine-only settings (fonts, keys like F8), untracked
globinclude local.conf
