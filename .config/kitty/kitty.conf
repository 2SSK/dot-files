font_family      Jetbrains Mono Nerd Font 
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15

disble_ligatures no
enable_audio_bell no

tab_bar_edge bottom
tab_bar_style powerline
tab_bar_margin_width 8.0
# active_tab_foreground   #000000
# active_tab_background   #7aa2f7
# inactive_tab_foreground #a9b1d6
# inactive_tab_background #1a1b26
tab_separator " "

hide_window_decorations true

url_style curly

cursor_shape block
cursor_blink_interval 0

cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

remember_window_size  no
# initial_window_width 640
# initial_window_height 480
window_padding_width 25

background_opacity 0.75
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

sync_to_monitor no

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

allow_remote_control yes

map f8 launch --type=tab today-note

# include themes/tokyonight.conf

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
