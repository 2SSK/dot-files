# Generated by theme_render.py (gruvbox light); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#b57614","#b57614","#427b58","#af3a03","#79740e","#9d0006"
[color "branch"]
	current = "#427b58 bold"
	local = "#3c3836"
	remote = "#b57614"
	upstream = "#79740e"
	plain = "#b57614"
[color "decorate"]
	HEAD = "#9d0006 bold"
	branch = "#b57614"
	tag = "#b57614"
	remoteBranch = "#427b58"
[color "diff"]
	meta = "#7c6f64 bold"
	frag = "#427b58"
	context = "#3c3836"
	old = "#9d0006"
	new = "#79740e"
	whitespace = "#b57614 reverse"
[color "status"]
	branch = "#b57614 bold"
	added = "#79740e"
	changed = "#b57614"
	untracked = "#9d0006"
[color "blame"]
	highlightRecent = "#7c6f64",1 month ago,"#3c3836",7 days ago,"#b57614"
[delta]
	file-style = "#b57614" bold
	file-decoration-style = "#d5c4a1" ul
	hunk-header-style = "#427b58"
	hunk-header-decoration-style = "#d5c4a1" box
	minus-style = "#9d0006"
	minus-emph-style = "#fbf1c7" "#9d0006"
	plus-style = "#79740e"
	plus-emph-style = "#fbf1c7" "#79740e"
	line-numbers-minus-style = "#9d0006"
	line-numbers-plus-style = "#79740e"
	line-numbers-zero-style = "#7c6f64"
	line-numbers-left-style = "#d5c4a1"
	line-numbers-right-style = "#d5c4a1"
