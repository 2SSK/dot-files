# Generated by theme_render.py (gruvbox light); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#b57614"
set -g @minimal-tmux-fg "#fbf1c7"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#af3a03],#[bg=#b57614]}#[fg=#fbf1c7 bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#7c6f64"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#b57614"
setw -g window-status-bell-style "fg=#b57614 bold"
set -g message-style "fg=#fbf1c7 bg=#b57614"
set -g message-command-style "fg=#fbf1c7 bg=#b57614"
set -g mode-style "fg=#3c3836 bg=#d5c4a1"
set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#b57614"
set -g popup-border-style "fg=#b57614"
set -g display-panes-colour "#7c6f64"
set -g display-panes-active-colour "#b57614"
set -g clock-mode-colour "#b57614"
