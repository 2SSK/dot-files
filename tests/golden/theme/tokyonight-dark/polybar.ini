; Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
; Linked as ~/.config/polybar/theme.ini, which ~/.config/polybar/config.ini includes.
[theme]
bg = #1a1b26
bg_alt = #16161e
surface = #292e42
overlay = #3b4261
fg = #c0caf5
fg_muted = #737aa2
primary = #7aa2f7
on_primary = #1a1b26
success = #9ece6a
warning = #e0af68
error = #f7768e
font_ui = Inter
font_mono = JetBrainsMono Nerd Font

; The items that mix colours in one label: polybar takes a reference only as a whole value, so
; these are made here, with the theme's colours in place: cpu 12%, mem 46%, ⏻.
[module/cpu]
type = internal/cpu
interval = 3
label = %{F#7aa2f7}cpu%{F-} %percentage:2%%
warn-percentage = 90
format-warn = <label-warn>
label-warn = %{F#7aa2f7}cpu%{F-} %{F#f7768e}%percentage:2%%%{F-}

[module/memory]
type = internal/memory
interval = 5
label = %{F#7aa2f7}mem%{F-} %percentage_used:2%%

[module/power]
type = custom/text
format = %{F#f7768e}⏻%{F-}
click-left = desktop menu power
