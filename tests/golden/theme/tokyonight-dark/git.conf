# Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#7aa2f7","#e0af68","#bb9af7","#ff9e64","#9ece6a","#f7768e"
[color "branch"]
	current = "#bb9af7 bold"
	local = "#c0caf5"
	remote = "#e0af68"
	upstream = "#9ece6a"
	plain = "#7aa2f7"
[color "decorate"]
	HEAD = "#f7768e bold"
	branch = "#7aa2f7"
	tag = "#e0af68"
	remoteBranch = "#bb9af7"
[color "diff"]
	meta = "#737aa2 bold"
	frag = "#bb9af7"
	context = "#c0caf5"
	old = "#f7768e"
	new = "#9ece6a"
	whitespace = "#e0af68 reverse"
[color "status"]
	branch = "#7aa2f7 bold"
	added = "#9ece6a"
	changed = "#e0af68"
	untracked = "#f7768e"
[color "blame"]
	highlightRecent = "#737aa2",1 month ago,"#c0caf5",7 days ago,"#7aa2f7"
[delta]
	file-style = "#7aa2f7" bold
	file-decoration-style = "#3b4261" ul
	hunk-header-style = "#bb9af7"
	hunk-header-decoration-style = "#3b4261" box
	minus-style = "#f7768e"
	minus-emph-style = "#1a1b26" "#f7768e"
	plus-style = "#9ece6a"
	plus-emph-style = "#1a1b26" "#9ece6a"
	line-numbers-minus-style = "#f7768e"
	line-numbers-plus-style = "#9ece6a"
	line-numbers-zero-style = "#737aa2"
	line-numbers-left-style = "#3b4261"
	line-numbers-right-style = "#3b4261"
