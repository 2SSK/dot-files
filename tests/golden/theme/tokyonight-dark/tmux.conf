# Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#7aa2f7"
set -g @minimal-tmux-fg "#1a1b26"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#ff9e64],#[bg=#7aa2f7]}#[fg=#1a1b26 bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#737aa2"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#e0af68"
setw -g window-status-bell-style "fg=#e0af68 bold"
set -g message-style "fg=#1a1b26 bg=#7aa2f7"
set -g message-command-style "fg=#1a1b26 bg=#e0af68"
set -g mode-style "fg=#c0caf5 bg=#283457"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g popup-border-style "fg=#7aa2f7"
set -g display-panes-colour "#737aa2"
set -g display-panes-active-colour "#7aa2f7"
set -g clock-mode-colour "#7aa2f7"
