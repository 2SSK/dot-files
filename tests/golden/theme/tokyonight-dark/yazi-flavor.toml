# Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
# yazi's "desktop" flavor (theme yazi/theme.toml picks it), from the desktop theme's roles; file
# previews use the same colours through tmtheme.xml (the silicon.tmTheme render). Icons: yazi's own.

[mgr]
cwd = { fg = "#7aa2f7" }
find_keyword = { fg = "#e0af68", bold = true, italic = true, underline = true }
find_position = { fg = "#ff9e64", bold = true, italic = true }
marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#f7768e", bg = "#f7768e" }
marker_marked = { fg = "#bb9af7", bg = "#bb9af7" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }
count_copied = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#7aa2f7" }
border_symbol = "│"
border_style = { fg = "#3b4261" }

[indicator]
parent = { fg = "#c0caf5", bg = "#283457" }
current = { fg = "#1a1b26", bg = "#7aa2f7" }
preview = { fg = "#c0caf5", bg = "#283457" }

[status]
overall = { fg = "#c0caf5", bg = "#16161e" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }
perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#9ece6a" }
perm_sep = { fg = "#737aa2" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#292e42" }
select_main = { fg = "#1a1b26", bg = "#bb9af7", bold = true }
select_alt = { fg = "#bb9af7", bg = "#292e42" }
unset_main = { fg = "#1a1b26", bg = "#ff9e64", bold = true }
unset_alt = { fg = "#ff9e64", bg = "#292e42" }

[tabs]
active = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
inactive = { fg = "#737aa2", bg = "#292e42" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
value = { fg = "#c0caf5" }
selected = { bg = "#283457" }

[cmp]
border = { fg = "#7aa2f7" }
active = { fg = "#1a1b26", bg = "#7aa2f7" }
inactive = { fg = "#c0caf5" }

[tasks]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
hovered = { fg = "#7aa2f7", underline = true }

[which]
cols = 3
mask = { bg = "#16161e" }
cand = { fg = "#7aa2f7" }
rest = { fg = "#737aa2" }
desc = { fg = "#c0caf5" }
separator = " ▶ "
separator_style = { fg = "#737aa2" }

[spot]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
tbl_col = { fg = "#c0caf5" }
tbl_cell = { fg = "#1a1b26", bg = "#7aa2f7" }

[help]
on = { fg = "#7aa2f7" }
run = { fg = "#c0caf5" }
hovered = { bg = "#283457", bold = true }
footer = { fg = "#1a1b26", bg = "#7aa2f7" }

[notify]
title_info = { fg = "#9ece6a" }
title_warn = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[pick]
border = { fg = "#7aa2f7" }
active = { fg = "#1a1b26", bg = "#7aa2f7" }
inactive = { fg = "#c0caf5" }

[confirm]
border = { fg = "#7aa2f7" }
title = { fg = "#c0caf5" }
content = { fg = "#c0caf5" }
list = { fg = "#c0caf5" }
btn_yes = { fg = "#1a1b26", bg = "#7aa2f7" }
btn_no = { fg = "#c0caf5", bg = "#292e42" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#ff9e64" },
	{ mime = "{audio,video}/*", fg = "#e0af68" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bb9af7" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#9ece6a" },
	{ mime = "*", is = "orphan", fg = "#f7768e" },
	{ mime = "application/*exec*", fg = "#f7768e" },
	{ url = "*", fg = "#c0caf5" },
	{ url = "*/", fg = "#7aa2f7" },
]
