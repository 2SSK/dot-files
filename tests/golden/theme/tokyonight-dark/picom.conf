# Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
# picom for i3 (X11), started by ~/.config/i3/conf.d/autostart.conf; theme reloads it (SIGUSR1).
# Rounded corners, soft shadows tinted from the palette, blur behind translucent windows, and short
# eased animations. Reference: man picom (window rules, animations).

backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 12;
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = -26;
shadow-offset-y = -18;
shadow-color = "#16161e"; # the palette's deepest tone, so shadows stay in the colour scheme
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# Matched in order; the last match wins
rules = (
	# The focused window glows faintly in the theme's accent
	{ match = "focused"; shadow-color = "#7aa2f7"; },
	{ match = "window_type = 'desktop'"; corner-radius = 0; shadow = false; blur-background = false; },
	{ match = "fullscreen"; corner-radius = 0; shadow = false; },
	{ match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'";
	  corner-radius = 8; },
	# GTK windows that draw their own decorations and shadow
	{ match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
	# i3 tab/stack headers (a nameless i3 frame) round only on top, the window under them only at
	# the bottom (i3 marks it maximised; 30 = below the top gap), so header and window form one card
	{ match = "class_g = 'i3-frame' && !name"; corner-radius = 0; shader = "picom/round-top.glsl"; shadow = false; },
	{ match = "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_MAXIMIZED_VERT' && y > 30";
	  corner-radius = 0; shader = "picom/round-bottom.glsl"; },
	# The screenshot region picker (slop: a transparent window over the screen): nothing added, so
	# the screen stays sharp while you choose what to take
	{ match = "class_g = 'slop' || name = 'slop'"; blur-background = false; shadow = false; corner-radius = 0;
	  animations = ({ triggers = [ "open", "show", "close", "hide", "geometry" ]; preset = "appear"; duration = 0.01; }); },
	# Tabs and stacks i3 keeps behind the visible one: invisible, so translucent windows don't show them
	{ match = "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_HIDDEN'"; opacity = 0; shadow = false; blur-background = false; },
	# The shell (the bar and the island's popup) draws its own shapes, shadows and motion on
	# transparent windows: picom adds nothing, not even its open/close animations
	# The shell's panels (control center, clipboard, wallpaper, launcher, capture) are transparent
	# windows as big as the screen with the panel drawn in them: no blur (it would cover the screen)
	{ match = "name = 'Desktop control center' || name = 'Desktop clipboard' || name = 'Desktop wallpaper' || name = 'Desktop launcher' || name = 'Desktop capture' || name = 'Desktop authentication'"; corner-radius = 0; shadow = false; blur-background = false;
	  animations = ({ triggers = [ "open", "show", "close", "hide", "geometry" ]; preset = "appear"; duration = 0.01; }); },
	{ match = "name = 'quickshell' || window_type = 'dock'"; corner-radius = 0; shadow = false; blur-background = false;
	  animations = ({ triggers = [ "open", "show", "close", "hide", "geometry" ]; preset = "appear"; duration = 0.01; }); },
	# No blur behind the bar either: its window spans the screen's width and picom blurs the whole
	# window, not the shape it takes, so the empty strip beside the bar went soft too. The bar's own
	# translucent colour still lets the wallpaper through (on sway, swayfx blurs just the bar).
);

# Open: rise from 94 % and fade in, easing out (fast start, soft landing). Close: the reverse, quicker.
# Tiling moves and resizes glide.
animations = (
	{
		triggers = [ "open", "show" ];
		opacity = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.24; start = 0; end = "window-raw-opacity"; };
		blur-opacity = "opacity";
		shadow-opacity = "opacity";
		scale-x = { curve = "cubic-bezier(0.22, 1, 0.36, 1)"; duration = 0.3; start = 0.94; end = 1; };
		scale-y = "scale-x";
		shadow-scale-x = "scale-x";
		shadow-scale-y = "scale-y";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
		shadow-offset-x = "offset-x";
		shadow-offset-y = "offset-y";
	},
	{
		triggers = [ "close", "hide" ];
		opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.16; start = "window-raw-opacity-before"; end = 0; };
		blur-opacity = "opacity";
		shadow-opacity = "opacity";
		scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.16; start = 1; end = 0.96; };
		scale-y = "scale-x";
		shadow-scale-x = "scale-x";
		shadow-scale-y = "scale-y";
		offset-x = "(1 - scale-x) / 2 * window-width";
		offset-y = "(1 - scale-y) / 2 * window-height";
		shadow-offset-x = "offset-x";
		shadow-offset-y = "offset-y";
	},
	{ triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.25; },
);
