# Generated by theme_render.py (tokyonight dark); edit the theme or this template, not the output.
# eza's colours (~/.config/eza/theme.yml links here). The shell runs eza without LS_COLORS, which
# would override this file.
colourful: true

filekinds:
  normal: {foreground: "#c0caf5"}
  directory: {foreground: "#7aa2f7", is_bold: true}
  symlink: {foreground: "#ff9e64"}
  pipe: {foreground: "#e0af68"}
  block_device: {foreground: "#e0af68", is_bold: true}
  char_device: {foreground: "#e0af68", is_bold: true}
  socket: {foreground: "#bb9af7"}
  special: {foreground: "#bb9af7"}
  executable: {foreground: "#9ece6a", is_bold: true}
  mount_point: {foreground: "#7aa2f7", is_underline: true}

perms:
  user_read: {foreground: "#e0af68"}
  user_write: {foreground: "#f7768e"}
  user_execute_file: {foreground: "#9ece6a", is_bold: true}
  user_execute_other: {foreground: "#9ece6a"}
  group_read: {foreground: "#e0af68"}
  group_write: {foreground: "#f7768e"}
  group_execute: {foreground: "#9ece6a"}
  other_read: {foreground: "#e0af68"}
  other_write: {foreground: "#f7768e"}
  other_execute: {foreground: "#9ece6a"}
  special_user_file: {foreground: "#bb9af7"}
  special_other: {foreground: "#bb9af7"}
  attribute: {foreground: "#737aa2"}

size:
  major: {foreground: "#ff9e64"}
  minor: {foreground: "#ff9e64"}
  number_byte: {foreground: "#c0caf5"}
  number_kilo: {foreground: "#c0caf5"}
  number_mega: {foreground: "#ff9e64"}
  number_giga: {foreground: "#e0af68"}
  number_huge: {foreground: "#f7768e"}
  unit_byte: {foreground: "#737aa2"}
  unit_kilo: {foreground: "#737aa2"}
  unit_mega: {foreground: "#ff9e64"}
  unit_giga: {foreground: "#e0af68"}
  unit_huge: {foreground: "#f7768e"}

users:
  user_you: {foreground: "#7aa2f7"}
  user_root: {foreground: "#f7768e"}
  user_other: {foreground: "#bb9af7"}
  group_yours: {foreground: "#7aa2f7"}
  group_other: {foreground: "#737aa2"}
  group_root: {foreground: "#f7768e"}

links:
  normal: {foreground: "#ff9e64"}
  multi_link_file: {foreground: "#ff9e64", is_bold: true}

git:
  new: {foreground: "#9ece6a"}
  modified: {foreground: "#e0af68"}
  deleted: {foreground: "#f7768e"}
  renamed: {foreground: "#ff9e64"}
  typechange: {foreground: "#bb9af7"}
  ignored: {foreground: "#737aa2"}
  conflicted: {foreground: "#f7768e", is_bold: true}

git_repo:
  branch_main: {foreground: "#c0caf5"}
  branch_other: {foreground: "#bb9af7"}
  git_clean: {foreground: "#9ece6a"}
  git_dirty: {foreground: "#e0af68"}

file_type:
  image: {foreground: "#ff9e64"}
  video: {foreground: "#e0af68"}
  music: {foreground: "#e0af68"}
  lossless: {foreground: "#e0af68"}
  crypto: {foreground: "#f7768e"}
  document: {foreground: "#9ece6a"}
  compressed: {foreground: "#bb9af7"}
  temp: {foreground: "#737aa2"}
  compiled: {foreground: "#737aa2"}
  build: {foreground: "#e0af68", is_underline: true}
  source: {foreground: "#c0caf5"}

punctuation: {foreground: "#737aa2"}
date: {foreground: "#bb9af7"}
inode: {foreground: "#737aa2"}
blocks: {foreground: "#737aa2"}
header: {foreground: "#c0caf5", is_underline: true}
octal: {foreground: "#ff9e64"}
flags: {foreground: "#737aa2"}
control_char: {foreground: "#f7768e"}
broken_symlink: {foreground: "#f7768e"}
broken_path_overlay: {is_underline: true}
