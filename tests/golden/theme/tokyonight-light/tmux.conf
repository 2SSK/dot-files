# Generated by theme_render.py (tokyonight light); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#2e7de9"
set -g @minimal-tmux-fg "#e1e2e7"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#b15c00],#[bg=#2e7de9]}#[fg=#e1e2e7 bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#68709a"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#8c6c3e"
setw -g window-status-bell-style "fg=#8c6c3e bold"
set -g message-style "fg=#e1e2e7 bg=#2e7de9"
set -g message-command-style "fg=#e1e2e7 bg=#8c6c3e"
set -g mode-style "fg=#3760bf bg=#b7c1e3"
set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#2e7de9"
set -g popup-border-style "fg=#2e7de9"
set -g display-panes-colour "#68709a"
set -g display-panes-active-colour "#2e7de9"
set -g clock-mode-colour "#2e7de9"
