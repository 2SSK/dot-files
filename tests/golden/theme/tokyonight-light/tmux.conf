# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
set -g status-style "fg=#68709a bg=default"
set -g status-left "#[fg=#3760bf bold]#S#{?client_prefix,#[fg=#2e7de9] ●,}"
set -g status-right "#[fg=#68709a]#h"
set -g window-status-format "#[fg=#68709a]#I #W"
set -g window-status-current-format "#[fg=#2e7de9 bold]#I #W"
setw -g window-status-activity-style "fg=#8c6c3e"
