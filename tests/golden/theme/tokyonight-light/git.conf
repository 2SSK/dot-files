# Generated by theme_render.py (tokyonight light); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#2e7de9","#8c6c3e","#9854f1","#b15c00","#587539","#f52a65"
[color "branch"]
	current = "#9854f1 bold"
	local = "#3760bf"
	remote = "#8c6c3e"
	upstream = "#587539"
	plain = "#2e7de9"
[color "decorate"]
	HEAD = "#f52a65 bold"
	branch = "#2e7de9"
	tag = "#8c6c3e"
	remoteBranch = "#9854f1"
[color "diff"]
	meta = "#68709a bold"
	frag = "#9854f1"
	context = "#3760bf"
	old = "#f52a65"
	new = "#587539"
	whitespace = "#8c6c3e reverse"
[color "status"]
	branch = "#2e7de9 bold"
	added = "#587539"
	changed = "#8c6c3e"
	untracked = "#f52a65"
[color "blame"]
	highlightRecent = "#68709a",1 month ago,"#3760bf",7 days ago,"#2e7de9"
[delta]
	file-style = "#2e7de9" bold
	file-decoration-style = "#a8aecb" ul
	hunk-header-style = "#9854f1"
	hunk-header-decoration-style = "#a8aecb" box
	minus-style = "#f52a65"
	minus-emph-style = "#e1e2e7" "#f52a65"
	plus-style = "#587539"
	plus-emph-style = "#e1e2e7" "#587539"
	line-numbers-minus-style = "#f52a65"
	line-numbers-plus-style = "#587539"
	line-numbers-zero-style = "#68709a"
	line-numbers-left-style = "#a8aecb"
	line-numbers-right-style = "#a8aecb"
