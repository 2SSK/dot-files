# Generated by theme_render.py (catppuccin dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#89b4fa","#f9e2af","#cba6f7","#fab387","#a6e3a1","#f38ba8"
[color "branch"]
	current = "#cba6f7 bold"
	local = "#cdd6f4"
	remote = "#f9e2af"
	upstream = "#a6e3a1"
	plain = "#89b4fa"
[color "decorate"]
	HEAD = "#f38ba8 bold"
	branch = "#89b4fa"
	tag = "#f9e2af"
	remoteBranch = "#cba6f7"
[color "diff"]
	meta = "#a6adc8 bold"
	frag = "#cba6f7"
	context = "#cdd6f4"
	old = "#f38ba8"
	new = "#a6e3a1"
	whitespace = "#f9e2af reverse"
[color "status"]
	branch = "#89b4fa bold"
	added = "#a6e3a1"
	changed = "#f9e2af"
	untracked = "#f38ba8"
[color "blame"]
	highlightRecent = "#a6adc8",1 month ago,"#cdd6f4",7 days ago,"#89b4fa"
[delta]
	file-style = "#89b4fa" bold
	file-decoration-style = "#45475a" ul
	hunk-header-style = "#cba6f7"
	hunk-header-decoration-style = "#45475a" box
	minus-style = "#f38ba8"
	minus-emph-style = "#1e1e2e" "#f38ba8"
	plus-style = "#a6e3a1"
	plus-emph-style = "#1e1e2e" "#a6e3a1"
	line-numbers-minus-style = "#f38ba8"
	line-numbers-plus-style = "#a6e3a1"
	line-numbers-zero-style = "#a6adc8"
	line-numbers-left-style = "#45475a"
	line-numbers-right-style = "#45475a"
