# Generated by theme_render.py (catppuccin dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#89b4fa"
set -g @minimal-tmux-fg "#1e1e2e"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#fab387],#[bg=#89b4fa]}#[fg=#1e1e2e bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#a6adc8"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#f9e2af"
setw -g window-status-bell-style "fg=#f9e2af bold"
set -g message-style "fg=#1e1e2e bg=#89b4fa"
set -g message-command-style "fg=#1e1e2e bg=#f9e2af"
set -g mode-style "fg=#cdd6f4 bg=#585b70"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-style "fg=#89b4fa"
set -g display-panes-colour "#a6adc8"
set -g display-panes-active-colour "#89b4fa"
set -g clock-mode-colour "#89b4fa"
