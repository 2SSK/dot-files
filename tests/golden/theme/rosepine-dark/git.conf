# Generated by theme_render.py (rosepine dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#c4a7e7","#f6c177","#31748f","#ebbcba","#9ccfd8","#eb6f92"
[color "branch"]
	current = "#31748f bold"
	local = "#e0def4"
	remote = "#f6c177"
	upstream = "#9ccfd8"
	plain = "#c4a7e7"
[color "decorate"]
	HEAD = "#eb6f92 bold"
	branch = "#c4a7e7"
	tag = "#f6c177"
	remoteBranch = "#31748f"
[color "diff"]
	meta = "#908caa bold"
	frag = "#31748f"
	context = "#e0def4"
	old = "#eb6f92"
	new = "#9ccfd8"
	whitespace = "#f6c177 reverse"
[color "status"]
	branch = "#c4a7e7 bold"
	added = "#9ccfd8"
	changed = "#f6c177"
	untracked = "#eb6f92"
[color "blame"]
	highlightRecent = "#908caa",1 month ago,"#e0def4",7 days ago,"#c4a7e7"
[delta]
	file-style = "#c4a7e7" bold
	file-decoration-style = "#524f67" ul
	hunk-header-style = "#31748f"
	hunk-header-decoration-style = "#524f67" box
	minus-style = "#eb6f92"
	minus-emph-style = "#191724" "#eb6f92"
	plus-style = "#9ccfd8"
	plus-emph-style = "#191724" "#9ccfd8"
	line-numbers-minus-style = "#eb6f92"
	line-numbers-plus-style = "#9ccfd8"
	line-numbers-zero-style = "#908caa"
	line-numbers-left-style = "#524f67"
	line-numbers-right-style = "#524f67"
