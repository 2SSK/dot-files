# Generated by theme_render.py (rosepine dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#c4a7e7"
set -g @minimal-tmux-fg "#191724"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#ebbcba],#[bg=#c4a7e7]}#[fg=#191724 bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#908caa"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#f6c177"
setw -g window-status-bell-style "fg=#f6c177 bold"
set -g message-style "fg=#191724 bg=#c4a7e7"
set -g message-command-style "fg=#191724 bg=#f6c177"
set -g mode-style "fg=#e0def4 bg=#403d52"
set -g pane-border-style "fg=#524f67"
set -g pane-active-border-style "fg=#c4a7e7"
set -g popup-border-style "fg=#c4a7e7"
set -g display-panes-colour "#908caa"
set -g display-panes-active-colour "#c4a7e7"
set -g clock-mode-colour "#c4a7e7"
