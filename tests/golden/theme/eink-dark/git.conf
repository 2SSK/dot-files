# Generated by theme_render.py (eink dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#cccccc","#cccccc","#aeaeae","#a4a4a4","#aeaeae","#e67e80"
[color "branch"]
	current = "#aeaeae bold"
	local = "#c2c2c2"
	remote = "#cccccc"
	upstream = "#aeaeae"
	plain = "#cccccc"
[color "decorate"]
	HEAD = "#e67e80 bold"
	branch = "#cccccc"
	tag = "#cccccc"
	remoteBranch = "#aeaeae"
[color "diff"]
	meta = "#909090 bold"
	frag = "#aeaeae"
	context = "#c2c2c2"
	old = "#e67e80"
	new = "#aeaeae"
	whitespace = "#cccccc reverse"
[color "status"]
	branch = "#cccccc bold"
	added = "#aeaeae"
	changed = "#cccccc"
	untracked = "#e67e80"
[color "blame"]
	highlightRecent = "#909090",1 month ago,"#c2c2c2",7 days ago,"#cccccc"
[delta]
	file-style = "#cccccc" bold
	file-decoration-style = "#545454" ul
	hunk-header-style = "#aeaeae"
	hunk-header-decoration-style = "#545454" box
	minus-style = "#e67e80"
	minus-emph-style = "#333333" "#e67e80"
	plus-style = "#aeaeae"
	plus-emph-style = "#333333" "#aeaeae"
	line-numbers-minus-style = "#e67e80"
	line-numbers-plus-style = "#aeaeae"
	line-numbers-zero-style = "#909090"
	line-numbers-left-style = "#545454"
	line-numbers-right-style = "#545454"
