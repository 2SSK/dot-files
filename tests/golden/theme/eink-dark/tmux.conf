# Generated by theme_render.py (eink dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
set -g status-style "fg=#909090 bg=default"
set -g status-left "#[fg=#c2c2c2 bold]#S#{?client_prefix,#[fg=#cccccc] ●,}"
set -g window-status-format "#[fg=#909090]#I #W"
set -g window-status-current-format "#[fg=#cccccc bold]#I #W"
setw -g window-status-activity-style "fg=#cccccc"
setw -g window-status-bell-style "fg=#cccccc bold"
set -g message-style "fg=#333333 bg=#cccccc"
set -g message-command-style "fg=#333333 bg=#cccccc"
set -g mode-style "fg=#c2c2c2 bg=#545454"
set -g pane-border-style "fg=#545454"
set -g pane-active-border-style "fg=#a4a4a4"
set -g popup-border-style "fg=#a4a4a4"
set -g display-panes-colour "#909090"
set -g display-panes-active-colour "#cccccc"
set -g clock-mode-colour "#cccccc"
