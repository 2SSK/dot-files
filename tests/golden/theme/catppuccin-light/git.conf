# Generated by theme_render.py (catppuccin light); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#1e66f5","#df8e1d","#8839ef","#fe640b","#40a02b","#d20f39"
[color "branch"]
	current = "#8839ef bold"
	local = "#4c4f69"
	remote = "#df8e1d"
	upstream = "#40a02b"
	plain = "#1e66f5"
[color "decorate"]
	HEAD = "#d20f39 bold"
	branch = "#1e66f5"
	tag = "#df8e1d"
	remoteBranch = "#8839ef"
[color "diff"]
	meta = "#6c6f85 bold"
	frag = "#8839ef"
	context = "#4c4f69"
	old = "#d20f39"
	new = "#40a02b"
	whitespace = "#df8e1d reverse"
[color "status"]
	branch = "#1e66f5 bold"
	added = "#40a02b"
	changed = "#df8e1d"
	untracked = "#d20f39"
[color "blame"]
	highlightRecent = "#6c6f85",1 month ago,"#4c4f69",7 days ago,"#1e66f5"
[delta]
	file-style = "#1e66f5" bold
	file-decoration-style = "#bcc0cc" ul
	hunk-header-style = "#8839ef"
	hunk-header-decoration-style = "#bcc0cc" box
	minus-style = "#d20f39"
	minus-emph-style = "#eff1f5" "#d20f39"
	plus-style = "#40a02b"
	plus-emph-style = "#eff1f5" "#40a02b"
	line-numbers-minus-style = "#d20f39"
	line-numbers-plus-style = "#40a02b"
	line-numbers-zero-style = "#6c6f85"
	line-numbers-left-style = "#bcc0cc"
	line-numbers-right-style = "#bcc0cc"
