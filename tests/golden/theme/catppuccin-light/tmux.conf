# Generated by theme_render.py (catppuccin light); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#1e66f5"
set -g @minimal-tmux-fg "#eff1f5"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#fe640b],#[bg=#1e66f5]}#[fg=#eff1f5 bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#6c6f85"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#df8e1d"
setw -g window-status-bell-style "fg=#df8e1d bold"
set -g message-style "fg=#eff1f5 bg=#1e66f5"
set -g message-command-style "fg=#eff1f5 bg=#df8e1d"
set -g mode-style "fg=#4c4f69 bg=#acb0be"
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"
set -g popup-border-style "fg=#1e66f5"
set -g display-panes-colour "#6c6f85"
set -g display-panes-active-colour "#1e66f5"
set -g clock-mode-colour "#1e66f5"
