# Generated by theme_render.py (rosepine light); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#907aa9","#ea9d34","#286983","#d7827e","#56949f","#b4637a"
[color "branch"]
	current = "#286983 bold"
	local = "#575279"
	remote = "#ea9d34"
	upstream = "#56949f"
	plain = "#907aa9"
[color "decorate"]
	HEAD = "#b4637a bold"
	branch = "#907aa9"
	tag = "#ea9d34"
	remoteBranch = "#286983"
[color "diff"]
	meta = "#797593 bold"
	frag = "#286983"
	context = "#575279"
	old = "#b4637a"
	new = "#56949f"
	whitespace = "#ea9d34 reverse"
[color "status"]
	branch = "#907aa9 bold"
	added = "#56949f"
	changed = "#ea9d34"
	untracked = "#b4637a"
[color "blame"]
	highlightRecent = "#797593",1 month ago,"#575279",7 days ago,"#907aa9"
[delta]
	file-style = "#907aa9" bold
	file-decoration-style = "#cecacd" ul
	hunk-header-style = "#286983"
	hunk-header-decoration-style = "#cecacd" box
	minus-style = "#b4637a"
	minus-emph-style = "#faf4ed" "#b4637a"
	plus-style = "#56949f"
	plus-emph-style = "#faf4ed" "#56949f"
	line-numbers-minus-style = "#b4637a"
	line-numbers-plus-style = "#56949f"
	line-numbers-zero-style = "#797593"
	line-numbers-left-style = "#cecacd"
	line-numbers-right-style = "#cecacd"
