# Generated by theme_render.py (rosepine light); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
# Status bar: minimal-tmux-status, top left: the session as a pill (accent colour while the
# prefix is held), then the windows, the current one as a pill in the primary colour
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-bg "#907aa9"
set -g @minimal-tmux-fg "#faf4ed"
set -g @minimal-tmux-right false
set -g @minimal-tmux-status-left "#{?client_prefix,#[bg=#d7827e],#[bg=#907aa9]}#[fg=#faf4ed bold] #S #[bg=default fg=default] "
set -g @minimal-tmux-window-status-format " #I:#W "
setw -g window-status-style "fg=#797593"
run-shell 'f=~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux; [ -x "$f" ] && "$f"; true'
setw -g window-status-activity-style "fg=#ea9d34"
setw -g window-status-bell-style "fg=#ea9d34 bold"
set -g message-style "fg=#faf4ed bg=#907aa9"
set -g message-command-style "fg=#faf4ed bg=#ea9d34"
set -g mode-style "fg=#575279 bg=#dfdad9"
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#907aa9"
set -g popup-border-style "fg=#907aa9"
set -g display-panes-colour "#797593"
set -g display-panes-active-colour "#907aa9"
set -g clock-mode-colour "#907aa9"
