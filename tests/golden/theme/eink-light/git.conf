# Generated by theme_render.py (eink light); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#333333","#333333","#545454","#5e5e5e","#545454","#f85552"
[color "branch"]
	current = "#545454 bold"
	local = "#333333"
	remote = "#333333"
	upstream = "#545454"
	plain = "#333333"
[color "decorate"]
	HEAD = "#f85552 bold"
	branch = "#333333"
	tag = "#333333"
	remoteBranch = "#545454"
[color "diff"]
	meta = "#686868 bold"
	frag = "#545454"
	context = "#333333"
	old = "#f85552"
	new = "#545454"
	whitespace = "#333333 reverse"
[color "status"]
	branch = "#333333 bold"
	added = "#545454"
	changed = "#333333"
	untracked = "#f85552"
[color "blame"]
	highlightRecent = "#686868",1 month ago,"#333333",7 days ago,"#333333"
[delta]
	file-style = "#333333" bold
	file-decoration-style = "#aeaeae" ul
	hunk-header-style = "#545454"
	hunk-header-decoration-style = "#aeaeae" box
	minus-style = "#f85552"
	minus-emph-style = "#cccccc" "#f85552"
	plus-style = "#545454"
	plus-emph-style = "#cccccc" "#545454"
	line-numbers-minus-style = "#f85552"
	line-numbers-plus-style = "#545454"
	line-numbers-zero-style = "#686868"
	line-numbers-left-style = "#aeaeae"
	line-numbers-right-style = "#aeaeae"
