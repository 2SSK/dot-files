# Generated by theme_render.py (eink light); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
set -g status-style "fg=#686868 bg=default"
set -g status-left "#[fg=#333333 bold]#S#{?client_prefix,#[fg=#333333] ●,}#[default]   "
set -g window-status-format "#[fg=#686868]#I #W"
set -g window-status-current-format "#[fg=#333333 bold]#I #W"
setw -g window-status-activity-style "fg=#333333"
setw -g window-status-bell-style "fg=#333333 bold"
set -g message-style "fg=#cccccc bg=#333333"
set -g message-command-style "fg=#cccccc bg=#333333"
set -g mode-style "fg=#333333 bg=#aeaeae"
set -g pane-border-style "fg=#aeaeae"
set -g pane-active-border-style "fg=#5e5e5e"
set -g popup-border-style "fg=#5e5e5e"
set -g display-panes-colour "#686868"
set -g display-panes-active-colour "#333333"
set -g clock-mode-colour "#333333"
