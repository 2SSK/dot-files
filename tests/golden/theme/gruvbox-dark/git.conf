# Generated by theme_render.py (gruvbox dark); edit the theme or this template, not the output.
# Included by ~/.config/git/config: git and delta colours from the desktop theme.
[log]
	graphColors = "#fabd2f","#fabd2f","#8ec07c","#fe8019","#b8bb26","#fb4934"
[color "branch"]
	current = "#8ec07c bold"
	local = "#ebdbb2"
	remote = "#fabd2f"
	upstream = "#b8bb26"
	plain = "#fabd2f"
[color "decorate"]
	HEAD = "#fb4934 bold"
	branch = "#fabd2f"
	tag = "#fabd2f"
	remoteBranch = "#8ec07c"
[color "diff"]
	meta = "#a89984 bold"
	frag = "#8ec07c"
	context = "#ebdbb2"
	old = "#fb4934"
	new = "#b8bb26"
	whitespace = "#fabd2f reverse"
[color "status"]
	branch = "#fabd2f bold"
	added = "#b8bb26"
	changed = "#fabd2f"
	untracked = "#fb4934"
[color "blame"]
	highlightRecent = "#a89984",1 month ago,"#ebdbb2",7 days ago,"#fabd2f"
[delta]
	file-style = "#fabd2f" bold
	file-decoration-style = "#504945" ul
	hunk-header-style = "#8ec07c"
	hunk-header-decoration-style = "#504945" box
	minus-style = "#fb4934"
	minus-emph-style = "#282828" "#fb4934"
	plus-style = "#b8bb26"
	plus-emph-style = "#282828" "#b8bb26"
	line-numbers-minus-style = "#fb4934"
	line-numbers-plus-style = "#b8bb26"
	line-numbers-zero-style = "#a89984"
	line-numbers-left-style = "#504945"
	line-numbers-right-style = "#504945"
