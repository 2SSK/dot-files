# Generated by theme_render.py (gruvbox dark); edit the theme or this template, not the output.
# Sourced by ~/.config/tmux/tmux.conf; theme re-sources it in a running server.
set -g status-style "fg=#a89984 bg=default"
set -g status-left "#[fg=#ebdbb2 bold]#S#{?client_prefix,#[fg=#fabd2f] ●,}#[default]   "
set -g window-status-format "#[fg=#a89984]#I #W"
set -g window-status-current-format "#[fg=#fabd2f bold]#I #W"
setw -g window-status-activity-style "fg=#fabd2f"
setw -g window-status-bell-style "fg=#fabd2f bold"
set -g message-style "fg=#282828 bg=#fabd2f"
set -g message-command-style "fg=#282828 bg=#fabd2f"
set -g mode-style "fg=#ebdbb2 bg=#504945"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g popup-border-style "fg=#fabd2f"
set -g display-panes-colour "#a89984"
set -g display-panes-active-colour "#fabd2f"
set -g clock-mode-colour "#fabd2f"
