# /etc/timeshift-autosnap.conf, installed by packages/system.sh timeshift: a snapshot before each
# pacman upgrade (at most one every 18 hours), the newest 3 kept. No GRUB entries for them: restore
# from Timeshift (or its live-USB) instead.
skipAutosnap=false
deleteSnapshots=true
maxSnapshots=3
updateGrub=false
snapshotDescription={timeshift-autosnap} {created before upgrade}
minHoursBetweenSnapshots=18
