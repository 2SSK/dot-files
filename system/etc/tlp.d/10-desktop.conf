# /etc/tlp.d/10-desktop.conf, installed by packages/system.sh power. TLP alone manages power (not
# auto-cpufreq: the two fight over the CPU); its defaults for everything else.
# TLP's three profiles, by suffix: _AC performance, _BAT balanced, _SAV power saver. On the charger
# balanced (turbo, but the laptop's balanced fan and power limit: it no longer sits at 100 °C under
# load), on battery the power saver (no turbo, the quiet profile: cooler, longer). The shell's
# control center switches between them; the next plug or unplug goes back to these.
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV

CPU_BOOST_ON_AC=1
PLATFORM_PROFILE_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance

CPU_BOOST_ON_BAT=1
PLATFORM_PROFILE_ON_BAT=balanced
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance

CPU_BOOST_ON_SAV=0
PLATFORM_PROFILE_ON_SAV=quiet
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Charging stops at 85%: a battery kept below full wears slower (Settings → Power changes it, in
# 20-charge-limit.conf; `sudo tlp fullcharge` once before a trip). Both of TLP's battery names, as
# ASUS's may be either; a start threshold of 0, as most laptops only have a stop one.
START_CHARGE_THRESH_BAT0=0
STOP_CHARGE_THRESH_BAT0=85
START_CHARGE_THRESH_BAT1=0
STOP_CHARGE_THRESH_BAT1=85
