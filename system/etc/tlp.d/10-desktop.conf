# /etc/tlp.d/10-desktop.conf, installed by packages/system.sh power. TLP alone manages power (not
# auto-cpufreq: the two fight over the CPU); its defaults for everything else. On battery: no turbo
# and the laptop's quiet profile (cooler, longer); on the charger: full speed.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=quiet
